[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pairlit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.0", "pydantic==2.11.7", "httpx==0.28.1", "uvicorn==0.48.0", "python-dotenv==1.0.1"]
[project.optional-dependencies]
test = ["pytest==9.0.3", "playwright==1.58.0"]
[project.scripts]
pairlit = "pairlit.cli:main"
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
